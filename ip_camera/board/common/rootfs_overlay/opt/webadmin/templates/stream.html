<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BabyCam Stream</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: #000;
            height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
        }
        #streamFrame {
            flex: 1;
            width: 100%;
            border: none;
        }

        .controls {
            position: fixed;
            top: 14px;
            right: 14px;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(20, 22, 28, 0.55);
            backdrop-filter: blur(8px);
            color: #eee;
            border: 1px solid rgba(255, 255, 255, 0.18);
            padding: 10px 16px;
            border-radius: 999px;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            user-select: none;
            transition: background 0.15s ease, border-color 0.15s ease;
        }
        .btn:hover {
            background: rgba(40, 44, 56, 0.75);
            border-color: rgba(255, 255, 255, 0.35);
        }
    </style>
</head>
<body>
    <div class="controls">
        <a href="/settings" class="btn">Settings</a>
    </div>
    <iframe id="streamFrame" allow="autoplay; fullscreen"></iframe>
    <script>
        const host = window.location.hostname;
        const protocol = window.location.protocol;
        let postfix = localStorage.getItem('stream_postfix') || "{{ stream_postfix or '/cam' }}";
        document.getElementById('streamFrame').src = `${protocol}//${host}:8889${postfix}?muted=0`;
    </script>
</body>
</html>
